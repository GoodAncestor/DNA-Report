[project]
name = "dna-report"
version = "0.1.0"
description = "Unified front door: one upload -> methylation + variant analysis in one evidence-tiered report"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # All three are private GoodAncestor repos (not on PyPI); git-source specs so a clean
    # install resolves from GitHub. Private-repo access uses git credentials (see README "Install").
    "biocore[variants] @ git+https://github.com/GoodAncestor/bio-core.git",
    "methylask @ git+https://github.com/GoodAncestor/MethylAsk.git",
    "geneask @ git+https://github.com/GoodAncestor/GeneAsk.git",
]

[project.scripts]
dna-report = "dnareport.cli:main"

[project.optional-dependencies]
# the HTTP front door Cloudflare fronts (see dnareport/web.py). CLI stays dep-light.
# boto3: the app READS worker-produced reports out of the R2 results bucket to
# serve /result (see web.py::_r2_result_html). Without it that import raises and
# every finished async report renders as a permanent "still processing" page.
web = ["fastapi", "uvicorn[standard]", "python-multipart", "redis", "boto3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dnareport*"]

[tool.setuptools.package-data]
"dnareport" = ["demo_data/*.csv", "demo_data/*.vcf", "docs/*.md"]
