[project]
name = "dna-report"
version = "0.1.0"
description = "Unified front door: one upload -> methylation + variant analysis in one evidence-tiered report"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # All three are private GoodAncestor repos (not on PyPI); git-source specs so a clean
    # install resolves from GitHub. Private-repo access uses git credentials (see README "Install").
    "biocore[variants] @ git+https://github.com/GoodAncestor/bio-core.git",
    "methylask @ git+https://github.com/GoodAncestor/MethylAsk.git",
    # [alphagenome] pulls the DeepMind client the regulatory-VEP annotator needs.
    # It is an extra in GeneAsk because the CLI does not need it, but this app
    # DOES: without it score_variant's ImportError is swallowed by the same
    # catch-all that stops one bad variant failing a report, so the feature would
    # sit switched on and silently score nothing.
    "geneask[alphagenome] @ git+https://github.com/GoodAncestor/GeneAsk.git",
]

[project.scripts]
dna-report = "dnareport.cli:main"

[project.optional-dependencies]
# the HTTP front door Cloudflare fronts (see dnareport/web.py). CLI stays dep-light.
# boto3: the app READS worker-produced reports out of the R2 results bucket to
# serve /result (see web.py::_r2_result_html). Without it that import raises and
# every finished async report renders as a permanent "still processing" page.
web = ["fastapi", "uvicorn[standard]", "python-multipart", "redis", "boto3"]
# The suite, declared rather than assembled ad hoc in CI. httpx2 is what
# starlette's TestClient requires — current starlette raises outright without it,
# and a dev venv carrying the older httpx runs the tests down a deprecated path
# instead, so this was invisible locally and only surfaced when CI installed
# clean. pytest is here for the same reason: a test dependency the workflow knows
# about but the project does not is a dependency waiting to drift.
test = ["pytest", "httpx2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dnareport*"]

[tool.setuptools.package-data]
"dnareport" = ["demo_data/*.csv", "demo_data/*.vcf", "docs/*.md"]
