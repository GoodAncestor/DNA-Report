# Build the DNA-Report web image and publish it to the container registry.
#
# Registry is a SINGLE swappable reference (the REGISTRY env below). It defaults
# to ghcr.io as an interim — free and natively authed to this org. When
# goodancestor/infra stands up its own registry, change REGISTRY (and the login
# step) here and the image ref in dna-report-deploy's compose; nothing else moves.
#
# The build pulls biocore, methylask and geneask as git-source deps. All three
# are PUBLIC repos (verified 2026-08-03), so no authentication is required for
# that. ORG_READ_TOKEN is still passed through as a BuildKit secret because the
# Dockerfile no-ops when it is unset — it costs nothing now and keeps the build
# working the moment any of them goes private again. This comment previously
# described them as private long after they were not; if that changes, change
# this line with it.
name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # bio-core / MethylAsk / GeneAsk are resolved from their main at pip-install
  # time during this build, so a change to any of them alters the image without
  # touching this repo — and nothing here would rebuild. The engine repos
  # dispatch on push to main to close that.
  #
  # NOTHING below reads github.event.client_payload; the build resolves each dep
  # from main regardless, so a dispatch can only cause a rebuild, never steer it.
  repository_dispatch:
    types: [engine-updated]

env:
  REGISTRY: ghcr.io
  IMAGE: goodancestor/dna-report   # GHCR requires a lowercase path (owner GoodAncestor -> goodancestor)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to ghcr under this org
    steps:
      - uses: actions/checkout@v4

      # stamped into the image and reported by /health. github.sha is the commit
      # being built; the timestamp is generated here rather than taken from the
      # commit so a workflow_dispatch re-run of an unchanged commit is still
      # distinguishable from the image it replaced.
      - name: Record build identity
        id: build_id
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # ghcr accepts the workflow token

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          # build identity -> ENV in the image -> /health. Safe as build-args
          # (unlike the token below): a commit hash and a timestamp are not
          # secret, and being recorded in the layer history is the point.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_id.outputs.time }}
          # Not required while the sibling repos are public; passed anyway so the
          # build keeps working if one goes private. Always a BuildKit SECRET,
          # never a build-arg — a build-arg's value is recorded in the image's
          # layer history and would leak once the image is public.
          secrets: |
            git_token=${{ secrets.ORG_READ_TOKEN }}
      # after each build, delete UNTAGGED versions (dangling layers every :sha
      # build leaves) so the package doesn't accumulate. Built-in GITHUB_TOKEN.
      - name: Prune untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: dna-report
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
